version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - unconvert
  exclusions:
    rules:
      # The DTOs mark fields "deprecated upstream" that Jellyfin 12.1.0 still
      # sends; wire compatibility means we send them too (contract tests check).
      - linters: [staticcheck]
        text: "SA1019: .*/internal/jfapi/dto\\..* is deprecated: this property has been marked as deprecated upstream"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sysadmin/blockbustr
