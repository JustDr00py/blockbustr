# Rootless podman override (use with docker-compose.yml):
#   podman-compose -f deploy/docker-compose.yml -f deploy/docker-compose.podman.yml up -d
# Rootless podman maps your host uid to root inside the container, so the
# image's non-root user (uid 1000) can't write the bind-mounted data/cache
# directory. keep-id maps your host uid to the same uid inside instead.
# Docker doesn't need (or accept) this, which is why it lives in its own file.
services:
  blockbustr:
    userns_mode: keep-id
