# blockbustr configuration. Copy to config.yaml; every key is optional.
# Environment variables (BLOCKBUSTR_*) override these values; see deploy/.env.example.
server:
  listen: ":8096"              # Jellyfin's port, so clients find it by default
  external_url: ""             # e.g. https://blockbustr.example.ts.net
  server_name: blockbustr
  shutdown_timeout: 10s
  discovery: true              # answer LAN discovery on UDP 7359 (containers: publish 7359/udp, set external_url)
  stream_url_ttl: 48h          # how long signed stream URLs handed to clients stay valid
  # admin_username / admin_password: better set via BLOCKBUSTR_ADMIN_USERNAME/_PASSWORD in .env
database:
  url: postgres://blockbustr:blockbustr@postgres:5432/blockbustr?sslmode=disable
redis:
  url: redis://redis:6379/0
paths:
  cache: /cache                # transcode/ and images/ live under here by default
compat:
  reported_version: "12.1.0"   # Jellyfin version we claim (DESIGN §11 Q1)
  product_name: Jellyfin Server
  proxy_clients: []            # clients that always get proxied remote streams
  redirect_clients: []         # clients that may follow http->https redirects
  legacy_auth: true            # also accept X-Emby-* headers / ?api_key= (stock 12.1.0 rejects them)
transcode:
  hwaccel: auto                # auto | none | qsv | vaapi
  segment_seconds: 3
  max_sessions: 4
  software: true               # false: the CPU never transcodes video (no libx264 fallback,
                               # no HDR tonemapping or subtitle burn-in); hardware only
metadata:
  language: en-US
log:
  level: info                  # debug | info | warn | error
  format: text                 # text | json
libraries:                     # matched to the database by name
  - name: Movies
    kind: movies               # movies | tvshows
    paths: [/media/Movies]
  - name: Shows
    kind: tvshows
    paths: [/media/Series]
scan:
  on_start: true
  interval: 6h                 # "0s" disables periodic rescans (durations need a unit)
  probe_workers: 0             # concurrent ffprobe runs; 0 = NumCPU/2
  probe_timeout: 2m
  missing_grace: 24h           # missing files are kept (hidden) this long before deletion
  watch: true                  # rescan a library when its files change (not on network shares)
  watch_delay: 30s             # ...once they've been quiet this long
stremio:                       # addons themselves are managed through /blockbustr/addons
  sync_interval: 6h            # re-sync enabled catalogs; "0s" = only at start and on changes
  catalog_pages: 2             # pages fetched per catalog
  redirect_hosts: []           # stream proxies apps fetch from themselves (e.g. [mfp.example.com],
                               # see deploy/proxy/); empty = every addon stream goes through blockbustr
  streams:
    timeout: 6s                # per addon, when collecting streams for playback
    uhd_slots: 3               # versions offered at 2160p and up
    hd_slots: 4                # versions offered below 2160p; unfilled slots of
                               # either go to the best remaining ("best available")
    probe_versions: 0          # versions probed ahead of play per title, best first
                               # (~10 MB each through the debrid service); 0 = all
    languages: []              # preferred audio, ISO 639-1 (e.g. [en, de])
    allow_groups: []           # release groups ranked higher
    deny_groups: []            # release groups never offered
  subtitles:                   # from subtitle addons (e.g. OpenSubtitles v3)
    languages: []              # ISO 639-1 (e.g. [en, fr]); empty = English
    per_language: 3            # tracks offered per language
search:                        # the clients' search also finds titles you don't have (DESIGN §7.4)
  enabled: true
  timeout: 3s                  # budget for one search; slower sources are left out
  retention: 168h              # found titles nobody played or favourited are dropped after this
  cinemeta_fallback: true      # search Cinemeta when no enabled addon has a search catalog
metrics:                       # Prometheus (P4.4); pprof is at /debug/pprof/ for admins either way
  enabled: false               # serve /metrics on the main port
  token: ""                    # require "Authorization: Bearer <token>" (better: BLOCKBUSTR_METRICS_TOKEN in .env)
